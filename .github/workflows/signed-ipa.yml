name: Signed IPA

# Manual only. Requires the five signing secrets configured in the repository
# (Settings > Secrets and variables > Actions). Never triggers on push or PR.
# Full setup instructions: docs/BUILD.md
on:
  workflow_dispatch:
    inputs:
      configuration:
        description: Build configuration
        type: choice
        default: Release
        options: [Release]
      upload_to_appstore:
        description: Upload the IPA to App Store Connect after export
        type: boolean
        default: false

concurrency:
  group: signed-ipa
  cancel-in-progress: false   # never cancel a signing run half way

permissions:
  contents: read

env:
  XCODE_VERSION: "16.x"
  KEYCHAIN_NAME: signing.keychain-db

jobs:
  signed-ipa:
    name: signed-ipa
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode ${{ env.XCODE_VERSION }}
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: ${{ env.XCODE_VERSION }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      # Imported into a throwaway keychain that is deleted in the "always" step
      # at the end. Secrets arrive as env vars and are never printed.
      - name: Import certificate into temporary keychain
        env:
          CERTIFICATE_P12_BASE64: ${{ secrets.CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          set -euo pipefail
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          printf '%s' "$CERTIFICATE_P12_BASE64" | base64 --decode --output "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" signing.keychain
          security set-keychain-settings -lut 21600 signing.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" signing.keychain
          security import "$CERT_PATH" \
            -k signing.keychain \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" signing.keychain
          security list-keychain -d user -s signing.keychain login.keychain-db
          security set-keychain-settings -lut 21600 login.keychain-db
          rm -f "$CERT_PATH"

      - name: Archive
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          xcodebuild \
            -project EnglishLearning.xcodeproj \
            -scheme EnglishLearning \
            -configuration ${{ inputs.configuration }} \
            -destination 'generic/platform=iOS' \
            -archivePath build/EnglishLearning.xcarchive \
            -derivedDataPath .build \
            -allowProvisioningUpdates \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" \
            CODE_SIGN_STYLE=Manual \
            PROVISIONING_PROFILE_SPECIFIER=EnglishLearning \
            archive | tail -n 60

      # `app-store-connect` (not `app-store`) is the current method name in
      # Xcode 15+; `app-store` is deprecated but still accepted by Xcode 16.
      - name: Generate ExportOptions.plist
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          mkdir -p build
          cat > build/ExportOptions.plist <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>app-store-connect</string>
            <key>teamID</key>
            <string>${APPLE_TEAM_ID}</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>uploadSymbols</key>
            <true/>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST

      - name: Export IPA
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          xcodebuild \
            -exportArchive \
            -archivePath build/EnglishLearning.xcarchive \
            -exportPath build/export \
            -exportOptionsPlist build/ExportOptions.plist \
            DEVELOPMENT_TEAM="$APPLE_TEAM_ID" | tail -n 40
          ls -l build/export

      - name: Upload IPA artifact
        uses: actions/upload-artifact@v4
        with:
          name: EnglishLearning-signed-ipa
          path: build/export/*.ipa
          if-no-files-found: error
          retention-days: 30

      # Optional. Uses the App Store Connect API key, not a user password, so
      # the secret is a one-time token that can be revoked at any time.
      - name: Upload to App Store Connect
        if: ${{ inputs.upload_to_appstore }}
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
        run: |
          set -euo pipefail
          IPA=$(ls build/export/*.ipa | head -n 1)
          xcrun altool --upload-file "$IPA" --type ios \
            --username "$APPLE_ID" \
            --password "$APPLE_APP_SPECIFIC_PASSWORD" \
            --verbose

      - name: Delete temporary keychain
        if: always()
        run: |
          security delete-keychain signing.keychain || true
          security list-keychain -d user -s login.keychain-db
