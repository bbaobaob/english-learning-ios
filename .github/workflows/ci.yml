name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# One run per ref; a new push cancels the previous, still-queued run.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  SWIFT_VERSION: "6.0"

jobs:
  # The engine is Foundation-only, so it builds and tests on a cheap Linux
  # runner. This is the reason the core is a separate package (see
  # docs/ARCHITECTURE.md section 0).
  test-core:
    name: test-core (linux)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - name: Install Swift ${{ env.SWIFT_VERSION }}
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: ${{ env.SWIFT_VERSION }}

      - name: swift build
        run: swift build --package-path Packages/EnglishCore

      - name: swift test
        run: swift test --package-path Packages/EnglishCore

  # SwiftData needs Darwin (and macOS 14+), so this one cannot be Linux.
  test-store:
    name: test-store (macos)
    runs-on: macos-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Runner images rename and re-version Xcode, so a hardcoded path breaks.
        # Prefer a 16.x when the image still ships one; otherwise take the newest.
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$XCODE" ]; then
            XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          echo "Using $XCODE"
          sudo xcode-select --switch "$XCODE"

      - name: swift --version
        run: swift --version

      - name: swift test
        run: swift test --package-path Packages/EnglishStore

  # Content is data, and data breaks silently: a truncated JSON file only shows
  # up as a missing topic card on a device. Validate it on every push.
  lint-content:
    name: lint-content
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Validate content
        run: python3 Scripts/validate_content.py

      - name: Validator self-test
        run: python3 Scripts/validate_content.py --selftest

  build-app:
    name: build-app (simulator)
    runs-on: macos-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        # Runner images rename and re-version Xcode, so a hardcoded path breaks.
        # Prefer a 16.x when the image still ships one; otherwise take the newest.
        run: |
          set -euo pipefail
          XCODE="$(ls -d /Applications/Xcode_16*.app 2>/dev/null | sort -V | tail -1 || true)"
          if [ -z "$XCODE" ]; then
            XCODE="$(ls -d /Applications/Xcode*.app | sort -V | tail -1)"
          fi
          echo "Using $XCODE"
          sudo xcode-select --switch "$XCODE"

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate project
        run: xcodegen generate

      - name: Build
        run: |
          set -o pipefail
          xcodebuild \
            -project EnglishLearning.xcodeproj \
            -scheme EnglishLearning \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            build | tail -n 60
