# EnglishLearning — XcodeGen project spec (XcodeGen 2.x, schema 2.38+)
#
# ============================================================================
#  THE .xcodeproj IS GENERATED. IT IS NOT IN GIT AND MUST NEVER BE COMMITTED.
#  EnglishLearning.xcodeproj/ is listed in .gitignore on purpose.
#
#  Why: a generated project file produces merge conflicts on every run,
#  encodes absolute paths of whoever generated it, and lets Xcode write
#  xcuserdata into a tracked file. The only source of truth for the project
#  layout is this YAML file.
#
#  How to get a project:
#      brew install xcodegen
#      make project          # or: xcodegen generate
#      open EnglishLearning.xcodeproj
#
#  Re-run `xcodegen generate` after ANY change to this file, to package
#  dependencies, or to the App/ source tree. Never edit the generated project
#  in Xcode — those edits are lost on the next generate.
#
#  Layout and API contract: docs/ARCHITECTURE.md
# ============================================================================

name: EnglishLearning

options:
  bundleIdPrefix: com.b
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  groupSortPosition: top          # groups sorted alphabetically
  createIntermediateGroups: true  # mirror on-disk folder nesting in the navigator
  generateEmptyDirectories: false
  minimumXcodeGenVersion: 2.38.0
  deploymentTargetSync: false

# Project-wide defaults. Targets inherit these.
settings:
  base:
    SWIFT_VERSION: "5.10"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: ""
    CODE_SIGN_STYLE: Automatic
    SWIFT_TREAT_WARNINGS_AS_ERRORS: NO
    GCC_TREAT_WARNINGS_AS_ERRORS: NO
    CLANG_ENABLE_MODULES: YES
    ALWAYS_SEARCH_USER_PATHS: NO
  configs:
    Debug:
      SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
      SWIFT_OPTIMIZATION_LEVEL: "-Onone"
    Release:
      SWIFT_OPTIMIZATION_LEVEL: "-O"
      SWIFT_COMPILATION_MODE: wholemodule
      VALIDATE_PRODUCT: YES

# Local SPM packages. XcodeGen writes a file-system dependency into the
# project; resolution is still performed by SwiftPM at build time.
packages:
  EnglishCore:
    path: Packages/EnglishCore
  EnglishStore:
    path: Packages/EnglishStore

targets:
  EnglishLearning:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: App
    dependencies:
      - package: EnglishCore
        product: EnglishCore
      - package: EnglishStore
        product: EnglishStore
    settings:
      base:
        PRODUCT_NAME: EnglishLearning
        PRODUCT_BUNDLE_IDENTIFIER: com.b.english
        INFOPLIST_KEY_CFBundleDisplayName: English Learning
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        TARGETED_DEVICE_FAMILY: "1,2"
        SWIFT_EMIT_LOC_STRINGS: YES
    # Info.plist is generated from this spec (path is gitignored). Never
    # hand-edit the file on disk — it is overwritten on every generate.
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: English Learning
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIUserInterfaceStyle: Automatic
        UIBackgroundModes:
          - audio
        NSMicrophoneUsageDescription: >-
          English Learning records your voice so it can play back and compare
          it against the target sentence in the Speaking and Dictation modules.
        NSSpeechRecognitionUsageDescription: >-
          English Learning uses on-device speech recognition to check what you
          said in speaking and dictation exercises.
        ITSAppUsesNonExemptEncryption: false
        UIApplicationSupportsIndirectInputEvents: true
        LSApplicationCategoryType: public.app-category.education

schemes:
  EnglishLearning:
    build:
      targets:
        EnglishLearning: all
    run:
      config: Debug
    test:
      config: Debug
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release

  # The engine is tested in its own scheme so `xcodebuild -scheme EnglishCore
  # test` runs the portable package on its own, without the app target.
  EnglishCore:
    build:
      targets:
        EnglishCore: all
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - EnglishCoreTests
    run:
      config: Debug
